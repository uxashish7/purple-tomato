name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build web
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
        UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
        UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      run: |
        flutter build web --release \
          --base-href "/purple-tomato/" \
          --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY \
          --dart-define=UPSTOX_API_KEY=$UPSTOX_API_KEY \
          --dart-define=UPSTOX_API_SECRET=$UPSTOX_API_SECRET \
          --dart-define=UPSTOX_REDIRECT_URI=$UPSTOX_REDIRECT_URI \
          --dart-define=SUPABASE_URL=$SUPABASE_URL \
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
          --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
          --dart-define=ALPHA_VANTAGE_API_KEY=$ALPHA_VANTAGE_API_KEY
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
